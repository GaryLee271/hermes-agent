name: Build Hermes Light for Apple Silicon

on:
  push:
    branches: [light-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      UPSTREAM_TAG: v0.23.2
      UPSTREAM_COMMIT: ae2a81ccc00e9b7c06301523e5bb09608397149c
      RELEASE_CLAIM_TAG: rc.13-v0.23.2
      RELEASE_CLAIM_OBJECT: 78a1f7893d03e7de148c6636f073798e06e07906
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # 使用 fork 的干净提交打包，并单独对照上游发布标签。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build the Light DMG and ZIP
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --depth=1 https://github.com/NousResearch/hermes-agent.git \
            "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" \
            "refs/tags/$RELEASE_CLAIM_TAG:refs/tags/$RELEASE_CLAIM_TAG"
          test "$(git rev-parse "$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_COMMIT"
          test -z "$(git status --porcelain)"
          # 避免 Spotlight 占用打包阶段的临时挂载卷。
          sudo mdutil -a -i off || true
          # 上游发布脚本用同版本的候选标签确定打包时间，校验标签对象及其提交。
          test "$(git rev-parse "$RELEASE_CLAIM_TAG")" = "$RELEASE_CLAIM_OBJECT"
          test "$(git rev-parse "$RELEASE_CLAIM_TAG^{commit}")" = "$UPSTREAM_COMMIT"
          python scripts/bundles/desktop.py --tag "$UPSTREAM_TAG" --release-commit "$GITHUB_SHA" --variant light

      - name: Test first-run connection choices
        run: |
          node_bin="$(python -c 'import json; print(json.load(open(".build/desktop-job/prepared.json"))["node"])')"
          cd apps/desktop
          "$node_bin" node_modules/vitest/vitest.mjs run --project ui src/components/desktop-install-overlay.test.tsx
          "$node_bin" node_modules/vitest/vitest.mjs run --project electron electron/first-run-setup-main-process.test.ts

      - name: Sign and package the fork downloads
        run: |
          release=apps/desktop/release
          stem="HermesLight-${UPSTREAM_TAG#v}-mac-arm64"
          app="$release/mac-arm64/Hermes Light.app"
          test -d "$app"
          node_bin="$(python -c 'import json; print(json.load(open(".build/desktop-job/prepared.json"))["node"])')"
          # 使用上游锁定的 osx-sign 为主程序和嵌套组件签名，并沿用本来的权限声明。
          (cd apps/desktop && "$node_bin" --input-type=module - "$GITHUB_WORKSPACE/source/$app" <<'JS'
          import { resolve } from 'node:path'
          import { sign } from '@electron/osx-sign'

          const app = process.argv[2]
          await sign({
            app,
            identity: '-',
            identityValidation: false,
            preAutoEntitlements: false,
            platform: 'darwin',
            type: 'distribution',
            optionsForFile: file => ({
              entitlements: resolve('electron', file === app ? 'entitlements.mac.plist' : 'entitlements.mac.inherit.plist'),
              hardenedRuntime: true,
              timestamp: 'none'
            })
          })
          JS
          )
          # 从同一个已签名应用生成 DMG 和 ZIP，避免发布签名前的文件。
          staging="$(mktemp -d "$RUNNER_TEMP/hermes-light-dmg.XXXXXX")"
          ditto "$app" "$staging/Hermes Light.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -ov -volname 'Hermes Light' -srcfolder "$staging" -format UDZO "$release/$stem.dmg"
          rm -- "$release/$stem.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$release/$stem.zip"

      - name: Verify the disk image and archive
        run: |
          release=apps/desktop/release
          stem="HermesLight-${UPSTREAM_TAG#v}-mac-arm64"
          dmg="$release/$stem.dmg"
          zip="$release/$stem.zip"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          mount_point="$(mktemp -d "$RUNNER_TEMP/hermes-light.XXXXXX")"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          app_name="Hermes Light"
          app="$mount_point/$app_name.app"
          resources="$app/Contents/Resources"
          test "$(lipo -archs "$app/Contents/MacOS/$app_name")" = arm64
          codesign --verify --deep --strict "$app"
          test ! -e "$resources/agent-payload"
          # 同时校验 ZIP 携带的构建标记，确保两个下载件都来自 Light 构建。
          zip_stamp="$RUNNER_TEMP/hermes-light-zip-stamp.json"
          unzip -p "$zip" "$app_name.app/Contents/Resources/install-stamp.json" > "$zip_stamp"
          cmp "$resources/install-stamp.json" "$zip_stamp"
          python - "$zip_stamp" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              stamp = json.load(handle)
          assert stamp['payload'] == 'light' and 'runtime' not in stamp, stamp
          assert stamp['commit'] == os.environ['GITHUB_SHA'], stamp
          assert stamp['tag'] == os.environ['UPSTREAM_TAG'], stamp
          PY
          # 对外发布时附上两个经过检查的下载件的校验值。
          cd "$release"
          shasum -a 256 "$stem.dmg" "$stem.zip" > SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-light-macos-arm64
          path: |
            source/apps/desktop/release/HermesLight-*-mac-arm64.dmg
            source/apps/desktop/release/HermesLight-*-mac-arm64.zip
            source/apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
